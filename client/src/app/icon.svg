<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>

    <!-- Left Pillar: Vibrant Blue to Cyan -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Diagonal Ribbon: Warm Gold to Coral Red -->
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Right Pillar: Emerald to Mint Green -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle 3D shadow for the overlapping diagonal -->
    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded Tab Icon Badge (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="1.2"/>

  <!-- Left Stem (Blue) -->
  <rect x="13" y="14" width="9.5" height="36" rx="4.5" fill="url(#blueGrad)"/>

  <!-- Right Stem (Green) -->
  <rect x="41.5" y="14" width="9.5" height="36" rx="4.5" fill="url(#greenGrad)"/>

  <!-- Dynamic Overlapping Diagonal Stem (Google-style Warm Ribbon) -->
  <path d="M 13 18 L 22.5 14 L 51 46 L 41.5 50 Z" fill="url(#diagGrad)" filter="url(#ribbonShadow)"/>

  <!-- Decorative Corner Fold / Sparkle Dot -->
  <circle cx="50" cy="14" r="3.2" fill="#fbbf24"/>
</svg>
